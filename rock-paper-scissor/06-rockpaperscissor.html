<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="06-rockpaperscissor.css">
</head>
<body>

  <p class="heading">Rock Paper Scissors</p>

  <button onclick="playGame('rock')" class="move-button"><img src="images/rock-emoji.png"></button>
  <button onclick="playGame('paper')" class="move-button"><img src="images/paper-emoji.png"></button>
  <button onclick="playGame('scissors')" class="move-button"><img src="images/scissors-emoji.png"></button>

  <p class="js-result"></p>
  <p class="js-move">
  </p>
  <p class="js-score" ></p>

  <button onclick="ResetScore()" class="reset-score-button">Reset Score</button>

  <script src="06-rockpaperscissors.js"></script>
